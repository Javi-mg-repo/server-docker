services:
  mc:
      image: itzg/minecraft-server:java21
      tty: true
      stdin_open: true
      ports:
        - "25565:25565"
      environment:
        EULA: "TRUE"
        TYPE: "FABRIC"
        VERSION: "1.21.1"
        FABRIC_LOADER_VERSION: "0.18.4"
        MEMORY: "4096M" # 4gb
      volumes:
        - "./data:/data"
  playit:
      image: ghcr.io/playit-cloud/playit-agent:0.17
      network_mode: host
      environment:
      - SECRET_KEY=<introducir-contrasena>
