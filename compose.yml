services:
  mc:
      image: itzg/minecraft-server:java21
      tty: true
      stdin_open: true
      ports:
        - "25565:25565"
      environment:
        EULA: "TRUE"
        TYPE: "FABRIC"
        VERSION: "1.21.1"
        FABRIC_LOADER_VERSION: "0.18.4"
        MEMORY: "4096M" # 4gb
      volumes:
        - "./data:/data"
  playit:
    container_name: playit
    image: ghcr.io/mafen/playit-docker:latest
    restart: unless-stopped
    # If you want to presist the config
    volumes:
    - ./config:/etc/playit
